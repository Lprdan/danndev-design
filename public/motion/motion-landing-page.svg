<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Animação: uma landing page sendo montada, rolando até a oferta e o visitante virando lead">
  <defs>
    <clipPath id="viewport">
      <rect x="0.5" y="0.5" width="319" height="199" rx="8"/>
    </clipPath>
  </defs>

  <style>

    .frame { fill:#0b0e10; stroke:#2a3034; stroke-width:1; }
    .white { fill:#e6e9eb; }
    .gray  { fill:#4a5156; }
    .dim   { fill:#2a3034; }
    .panel { fill:#121719; stroke:#262c30; stroke-width:1; }
    .cyan  { fill:#2ee6df; }
    .txt   { font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; }

    .a { animation-duration:8s; animation-iteration-count:infinite;
         animation-timing-function:cubic-bezier(.2,.7,.2,1); }
    .bar { transform-box:fill-box; transform-origin:0 50%; }
    .mid { transform-box:fill-box; transform-origin:50% 50%; }

    .content { animation-name:out; }
    .page    { animation-name:scroll; animation-timing-function:cubic-bezier(.65,0,.25,1); }
    .thumb   { animation-name:thumb;  animation-timing-function:cubic-bezier(.65,0,.25,1); }
    .logo  { animation-name:logo; }
    .h1    { animation-name:h1; }
    .h2    { animation-name:h2; }
    .s1    { animation-name:s1; }
    .s2    { animation-name:s2; }
    .cta   { animation-name:cta; }
    .chev  { animation-name:chev; }
    .vid   { animation-name:vid; }
    .vprog { animation-name:vprog; }
    .stars { animation-name:stars; }
    .quote { animation-name:quote; }
    .card  { animation-name:card; }
    .press { animation-name:press; }
    .ring  { animation-name:ring; }
    .toast { animation-name:toast; }
    .cursor{ animation-name:cursor; transform-box:fill-box; transform-origin:0 0; }

    @keyframes out    { 0%,88%{opacity:1} 96%,100%{opacity:0} }
    @keyframes logo   { 0%,2%{opacity:0} 8%,100%{opacity:1} }
    @keyframes h1     { 0%,4%{transform:scaleX(0)}  12%,100%{transform:scaleX(1)} }
    @keyframes h2     { 0%,8%{transform:scaleX(0)}  16%,100%{transform:scaleX(1)} }
    @keyframes s1     { 0%,12%{transform:scaleX(0)} 18%,100%{transform:scaleX(1)} }
    @keyframes s2     { 0%,14%{transform:scaleX(0)} 20%,100%{transform:scaleX(1)} }
    @keyframes cta    { 0%,16%{opacity:0;transform:scale(.8)} 21%{opacity:1;transform:scale(1)}
                        24%{transform:scale(1.06)} 27%,100%{opacity:1;transform:scale(1)} }
    @keyframes chev   { 0%,19%{opacity:0;transform:none} 21%{opacity:1} 23%{transform:translateY(3px)}
                        25%{transform:none} 27%{transform:translateY(3px)} 29%,100%{opacity:1;transform:none} }
    @keyframes scroll { 0%,27%{transform:none} 35%,46%{transform:translateY(-95px)} 54%,100%{transform:translateY(-170px)} }
    @keyframes thumb  { 0%,27%{transform:none} 35%,46%{transform:translateY(47px)} 54%,100%{transform:translateY(84px)} }
    @keyframes vid    { 0%,27%{opacity:0;transform:translateY(10px)} 34%,100%{opacity:1;transform:none} }
    @keyframes vprog  { 0%,34%{transform:scaleX(0)} 46%,100%{transform:scaleX(1)} }
    @keyframes stars  { 0%,32%{opacity:0;transform:scale(.6)} 38%,100%{opacity:1;transform:none} }
    @keyframes quote  { 0%,36%{transform:scaleX(0)} 41%,100%{transform:scaleX(1)} }
    @keyframes card   { 0%,46%{opacity:0;transform:translateY(12px)} 54%,100%{opacity:1;transform:none} }
    @keyframes cursor {
      0%,52%  { opacity:0; transform:translate(300px,210px); }
      55%     { opacity:1; }
      61%     { transform:translate(162px,172px); }
      62.5%   { transform:translate(162px,172px) scale(.86); }
      64%,82% { opacity:1; transform:translate(162px,172px); }
      88%,100%{ opacity:0; transform:translate(162px,172px); }
    }
    @keyframes press  { 0%,61%{transform:none} 63%{transform:scale(.92)} 66%,100%{transform:none} }
    @keyframes ring   { 0%,62%{opacity:0;transform:none} 63%{opacity:.9;transform:scale(1)} 75%,100%{opacity:0;transform:scale(1.3,2.1)} }
    @keyframes toast  { 0%,66%{opacity:0;transform:translateX(24px)} 70%,84%{opacity:1;transform:none} 88%,100%{opacity:0;transform:none} }

    @media (prefers-reduced-motion: reduce) {
      .a { animation:none !important; }
      .cursor, .toast { opacity:0; }
    }
  </style>

  <rect class="frame" x="0.5" y="0.5" width="319" height="199" rx="8"/>

  <g class="content a" clip-path="url(#viewport)">

    <g class="page a">

      <circle class="logo a" cx="18" cy="21" r="5" fill="none" stroke="#e6e9eb" stroke-width="1.2"/>

      <rect class="white mid h1 a" x="60"  y="44" width="200" height="12" rx="2"/>
      <rect class="white mid h2 a" x="90"  y="61" width="140" height="12" rx="2"/>
      <rect class="gray  mid s1 a" x="80"  y="84" width="160" height="4"  rx="2"/>
      <rect class="gray  mid s2 a" x="105" y="93" width="110" height="4"  rx="2"/>

      <g class="cta mid a">
        <rect class="cyan" x="110" y="108" width="100" height="24" rx="12"/>
        <text class="txt" x="160" y="123.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#061012">Quero agora</text>
      </g>
      <path class="chev a" d="M154 144 L160 149 L166 144" fill="none" stroke="#6b7378" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

      <g class="vid a">
        <rect x="60" y="166" width="200" height="72" rx="5" fill="#141a1d" stroke="#2a3034"/>
        <circle cx="160" cy="199" r="12" fill="none" stroke="#2ee6df" stroke-width="1.2"/>
        <path d="M156 193 L166 199 L156 205 Z" fill="#e6e9eb"/>
        <rect x="70" y="229" width="180" height="2" rx="1" class="dim"/>
        <rect class="cyan bar vprog a" x="70" y="229" width="180" height="2" rx="1"/>
      </g>

      <g class="stars mid a" fill="#2ee6df">
        <path d="M134 250 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6-1.9 -3.6 1.9 .7-4 -2.9-2.8 4-.6z"/>
        <path d="M147 250 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6-1.9 -3.6 1.9 .7-4 -2.9-2.8 4-.6z"/>
        <path d="M160 250 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6-1.9 -3.6 1.9 .7-4 -2.9-2.8 4-.6z"/>
        <path d="M173 250 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6-1.9 -3.6 1.9 .7-4 -2.9-2.8 4-.6z"/>
        <path d="M186 250 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6-1.9 -3.6 1.9 .7-4 -2.9-2.8 4-.6z"/>
      </g>
      <rect class="gray mid quote a" x="115" y="267" width="90" height="3" rx="1.5"/>

      <g class="card a">
        <rect x="95" y="284" width="130" height="74" rx="6" fill="#121719" stroke="#2ee6df" stroke-opacity=".55"/>
        <rect class="cyan" x="128" y="278" width="64" height="12" rx="6"/>
        <text class="txt" x="160" y="286" text-anchor="middle" font-size="5.6" font-weight="700" letter-spacing=".4" fill="#061012">MAIS POPULAR</text>
        <rect class="white" x="125" y="298" width="70" height="10" rx="2"/>
        <rect class="gray"  x="113" y="314" width="94" height="3" rx="1.5"/>
        <rect class="dim"   x="123" y="321" width="74" height="3" rx="1.5"/>
        <rect class="ring mid a" x="110" y="332" width="100" height="16" rx="8" fill="none" stroke="#2ee6df" stroke-width="1.2"/>
        <g class="press mid a">
          <rect class="cyan" x="110" y="332" width="100" height="16" rx="8"/>
          <text class="txt" x="160" y="342.6" text-anchor="middle" font-size="7.2" font-weight="700" fill="#061012">Garantir vaga</text>
        </g>
      </g>
    </g>

    <rect class="dim" x="313" y="8" width="2" height="184" rx="1"/>
    <rect class="thumb a" x="313" y="8" width="2" height="100" rx="1" fill="#6b7378"/>

    <g class="toast a">
      <rect x="194" y="10" width="112" height="24" rx="6" fill="#121719" stroke="#2a3034"/>
      <circle cx="208" cy="22" r="6" fill="#2ee6df"/>
      <path d="M205.2 22.2 L207.3 24.2 L211 20.3" fill="none" stroke="#061012" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="txt" x="219" y="25" font-size="7.5" fill="#e6e9eb">Novo lead recebido</text>
    </g>
  </g>

  <path class="cursor a" d="M0 0 L0 13 L3.5 9.8 L6 15 L8.2 14 L5.8 9 L10 9 Z"
        fill="#ffffff" stroke="#05080a" stroke-width="0.9" stroke-linejoin="round"/>
</svg>
