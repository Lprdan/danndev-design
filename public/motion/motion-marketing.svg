<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Animação: uma busca no Google em que a empresa do cliente sobe para o primeiro lugar, aparece no mapa com 5 estrelas e ganha um anúncio patrocinado no topo">

  <defs>
    <clipPath id="viewport">
      <rect x="0.5" y="0.5" width="319" height="199" rx="8"/>
    </clipPath>

    <clipPath id="typed">
      <rect x="36" y="14" width="0" height="16">
        <animate attributeName="width" dur="8s" repeatCount="indefinite"
                 values="0;0;94;94;0;0" keyTimes="0;0.03;0.18;0.84;0.89;1"/>
      </rect>
    </clipPath>

    <path id="pin" d="M0 0 C-3 -4 -6 -7 -6 -11 A6 6 0 1 1 6 -11 C6 -7 3 -4 0 0 Z"/>
    <path id="star" d="M0 -3.2 L0.95 -1 L3.3 -0.95 L1.5 0.6 L2.05 2.9 L0 1.65 L-2.05 2.9 L-1.5 0.6 L-3.3 -0.95 L-0.95 -1 Z"/>
  </defs>

  <style>

    .sans { font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>

  <rect x="0.5" y="0.5" width="319" height="199" rx="8" fill="#0b0e10" stroke="#2a3034"/>

