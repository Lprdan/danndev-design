      <text class="sans" x="266" y="151.3" font-size="6.4" font-weight="700" fill="#e6e9eb" opacity="0">5,0<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.58;0.60;0.89;0.90;1"/></text>

      <rect x="208" y="164" width="98" height="24" rx="5" fill="#0f1416" stroke="#20272a"/>
      <rect x="216" y="171" width="44" height="4" rx="2" fill="#3a4146"/>
