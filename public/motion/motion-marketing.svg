        <use href="#star" x="229" y="149" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.89;0.90;1"/></use>
        <use href="#star" x="238" y="149" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.52;0.54;0.89;0.90;1"/></use>
        <use href="#star" x="247" y="149" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.54;0.56;0.89;0.90;1"/></use>
        <use href="#star" x="256" y="149" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.89;0.90;1"/></use>
