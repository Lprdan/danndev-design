    <path d="M27.6 23.6 L30 26" stroke="#6b7378" stroke-width="1.2" stroke-linecap="round"/>
    <text class="sans" x="37" y="25" font-size="8" fill="#e6e9eb" clip-path="url(#typed)">barbearia perto de mim</text>

    <g>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
