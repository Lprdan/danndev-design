            <text class="serif" x="9"   y="49" font-size="7.5" fill="#cfd4d7" textLength="156" lengthAdjust="spacingAndGlyphs">*** PROMOÇÃO IMPERDÍVEL *** LIGUE JÁ!!!</text>
            <text class="serif" x="169" y="49" font-size="7.5" fill="#cfd4d7" textLength="156" lengthAdjust="spacingAndGlyphs">*** PROMOÇÃO IMPERDÍVEL *** LIGUE JÁ!!!</text>
            <text class="serif" x="329" y="49" font-size="7.5" fill="#cfd4d7" textLength="156" lengthAdjust="spacingAndGlyphs">*** PROMOÇÃO IMPERDÍVEL *** LIGUE JÁ!!!</text>
          </g>
        </g>

        <g class="serif" font-size="7.5" text-anchor="middle" fill="#0b0e10">
