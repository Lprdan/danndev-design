        <rect x="146" y="140" width="108" height="10" fill="#0b0e10"/>
        <text class="serif" x="200" y="148" font-size="7" font-weight="700" text-anchor="middle" fill="#e6e9eb">EM CONSTRUÇÃO<animate attributeName="opacity" values="1;.25" dur="1s" calcMode="discrete" repeatCount="indefinite"/></text>

        <text class="serif" x="10" y="150" font-size="7" fill="#aab1b5">Visitantes:</text>
        <g class="mono" font-size="8" text-anchor="middle" fill="#e6e9eb">
          <rect x="10" y="155" width="10" height="12" fill="#000" stroke="#4a5156"/><text x="15" y="164">0</text>
          <rect x="21" y="155" width="10" height="12" fill="#000" stroke="#4a5156"/><text x="26" y="164">0</text>
          <rect x="32" y="155" width="10" height="12" fill="#000" stroke="#4a5156"/><text x="37" y="164">0</text>
          <rect x="43" y="155" width="10" height="12" fill="#000" stroke="#4a5156"/><text x="48" y="164">1</text>
          <rect x="54" y="155" width="10" height="12" fill="#000" stroke="#4a5156"/><text x="59" y="164">2</text>
          <rect x="65" y="155" width="10" height="12" fill="#000" stroke="#4a5156"/><text x="70" y="164">7</text>
        </g>

        <line x1="8" y1="176" x2="312" y2="176" stroke="#3a4146"/>
        <text class="serif" x="160" y="188" font-size="6.5" text-anchor="middle" fill="#6b7378">© 2009 · Todos os direitos reservados · Melhor visualizado em 800x600</text>
