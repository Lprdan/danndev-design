        <path d="M234 64 L304 122 M304 64 L234 122" stroke="#3a4146"/>
        <rect x="263" y="87" width="12" height="12" fill="#171b1e" stroke="#6b7378"/>
        <path d="M265.5 89.5 L272.5 96.5 M272.5 89.5 L265.5 96.5" stroke="#9aa1a6" stroke-width="1.2"/>

        <rect x="88" y="138" width="224" height="14" fill="#0b0e10"/>
