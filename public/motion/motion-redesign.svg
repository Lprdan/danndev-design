<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Animação: um site antigo é substituído por um design moderno, com comparação antes e depois">
  <defs>
    <clipPath id="viewport">
      <rect x="0.5" y="0.5" width="319" height="199" rx="8"/>
    </clipPath>

    <clipPath id="oldArea">
      <rect x="0" y="0" width="320" height="200">
        <animate attributeName="width" dur="8s" repeatCount="indefinite"
                 values="320;320;0;0;160;160;320;320" keyTimes="0;0.10;0.35;0.45;0.58;0.75;0.90;1"
                 calcMode="spline" keySplines="0 0 1 1;.65 0 .25 1;0 0 1 1;.65 0 .25 1;0 0 1 1;.65 0 .25 1;0 0 1 1"/>
      </rect>
    </clipPath>
    <clipPath id="marq">
      <rect x="9" y="41" width="302" height="10"/>
    </clipPath>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#9aa1a6"/>
    </pattern>
  </defs>

  <style>

    .frame { fill:#0b0e10; stroke:#2a3034; stroke-width:1; }
    .white { fill:#e6e9eb; }
    .gray  { fill:#4a5156; }
    .panel { fill:#121719; stroke:#262c30; stroke-width:1; }
    .cyan  { fill:#2ee6df; }
    .sans  { font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; }
    .serif { font-family: "Times New Roman", Times, Georgia, serif; }
    .mono  { font-family: "Courier New", Courier, monospace; }

  </style>

  <rect class="frame" x="0.5" y="0.5" width="319" height="199" rx="8"/>

