    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.58;0.62;0.72;0.76;1"/>
      <rect x="8" y="187" width="34" height="10" rx="5" fill="#0b0e10" stroke="#4a5156"/>
      <text class="sans" x="25" y="194.3" font-size="5.8" font-weight="700" letter-spacing=".4" text-anchor="middle" fill="#e6e9eb">ANTES</text>
      <rect x="274" y="187" width="38" height="10" rx="5" fill="#2ee6df"/>
      <text class="sans" x="293" y="194.3" font-size="5.8" font-weight="700" letter-spacing=".4" text-anchor="middle" fill="#061012">DEPOIS</text>
    </g>

    <g transform="translate(160 0)">
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
