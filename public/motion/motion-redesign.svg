        <circle cx="0" cy="100" r="10" fill="#0b0e10" stroke="#2ee6df" stroke-width="1.6"/>
        <path d="M-2 96 L-5.5 100 L-2 104 M2 96 L5.5 100 L2 104" fill="none" stroke="#e6e9eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
