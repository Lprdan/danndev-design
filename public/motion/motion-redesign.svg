      <text class="sans" x="156" y="24" font-size="8.5" fill="#c9cfd3">Sobre</text>
      <text class="sans" x="184" y="24" font-size="8.5" fill="#c9cfd3">Serviços</text>
      <rect class="cyan" x="240" y="10" width="58" height="22" rx="11"/>
      <text class="sans" x="269" y="24" font-size="8.5" font-weight="700" text-anchor="middle" fill="#061012">Contato</text>

      <rect class="white" x="14" y="46" width="150" height="11" rx="2"/>
      <rect class="white" x="14" y="62" width="104" height="11" rx="2"/>
      <rect class="gray"  x="14" y="86" width="150" height="4" rx="2"/>
      <rect class="gray"  x="14" y="96" width="106" height="4" rx="2"/>
      <rect x="14" y="113" width="44" height="14" rx="7" fill="none" stroke="#cfd4d7" stroke-width="1.2"/>

