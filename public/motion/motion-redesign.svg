        <rect x="10" y="9" width="300" height="25" fill="#1f2427" stroke="#4a5156"/>
        <text class="serif" x="160" y="26" font-size="12" font-weight="700" text-anchor="middle" fill="#cfd4d7" letter-spacing="1">BEM-VINDO AO NOSSO SITE!!!</text>

        <rect x="8" y="40" width="304" height="12" fill="#22282b" stroke="#3a4146"/>
        <g clip-path="url(#marq)">
