      <path d="M212 132 A30 30 0 0 1 272 132" fill="none" stroke="#6b7378" stroke-width="1.2"/>

      <rect class="panel" x="14"  y="144" width="92" height="42" rx="3"/>
      <rect class="panel" x="114" y="144" width="92" height="42" rx="3"/>
      <rect class="panel" x="214" y="144" width="92" height="42" rx="3"/>
      <rect x="24"  y="156" width="40" height="4" rx="2" fill="#3a4146"/>
      <rect x="124" y="156" width="40" height="4" rx="2" fill="#3a4146"/>
      <rect x="224" y="156" width="40" height="4" rx="2" fill="#3a4146"/>
      <rect x="24"  y="166" width="62" height="3" rx="1.5" fill="#2a3034"/>
