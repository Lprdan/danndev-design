          <path d="M10 126 V112 H80" fill="none" stroke="#cfd4d7"/><path d="M10 126 H80 V112" fill="none" stroke="#2a3034"/>
          <text x="45" y="122">Fale Conosco</text>
        </g>

        <rect x="88" y="58" width="224" height="72" fill="#1d2225" stroke="#4a5156"/>
        <line x1="226" y1="58" x2="226" y2="130" stroke="#4a5156"/>
        <g class="serif" font-size="7" fill="#aab1b5">
          <text x="94" y="70" font-weight="700" fill="#cfd4d7">Seja bem vindo!!!</text>
          <text x="94" y="82">Clique nos links ao lado</text>
